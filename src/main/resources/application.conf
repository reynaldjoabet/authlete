# Application configuration.
#
# Keys are kebab-case because that is pureconfig's default mapping from the camelCase field names in
# `config.AppConfig` (e.g. `serviceAccessToken` <-> `service-access-token`).
#
# Every value here can be overridden from the environment via `${?VAR}`. A key whose only definition
# is an unset `${?VAR}` stays *absent* rather than becoming empty, which is what lets
# `config.ConfigLoader` report it as missing at boot instead of the process starting up with a blank
# credential. Keep the variable names in sync with `ConfigLoader.EnvHints`.
#
# The whole file can be replaced at deploy time with -Dconfig.file=/path/to/app.conf.

server {
  host = "0.0.0.0"
  host = ${?SERVER_HOST}

  port = 8080
  port = ${?SERVER_PORT}

  # Must stay below the orchestrator's kill grace period (k8s terminationGracePeriodSeconds,
  # default 30s) or the process is SIGKILLed mid-drain and this never actually elapses.
  shutdown-timeout = 15 seconds
  shutdown-timeout = ${?SERVER_SHUTDOWN_TIMEOUT}

  idle-timeout = 60 seconds
  idle-timeout = ${?SERVER_IDLE_TIMEOUT}

  max-connections = 1024
  max-connections = ${?SERVER_MAX_CONNECTIONS}
}

authlete {
  base-url = "https://api.authlete.com/api"
  base-url = ${?AUTHLETE_BASE_URL}

  # Required. No default: a missing service id must fail the boot, not silently target the wrong
  # service.
  service-id = ${?AUTHLETE_SERVICE_ID}

  # Required on the v3 API, which authenticates with a bearer token rather than a key/secret pair.
  service-access-token = ${?AUTHLETE_SERVICE_ACCESSTOKEN}

  request-timeout = 30 seconds
  request-timeout = ${?AUTHLETE_REQUEST_TIMEOUT}

  is-dpop-enabled = false
  is-dpop-enabled = ${?AUTHLETE_DPOP_ENABLED}

  # Public/private key pair for DPoP signatures, JWK format. Required when is-dpop-enabled = true;
  # `AppConfig.validate` enforces that pairing.
  dpop-key = ${?AUTHLETE_DPOP_KEY}

  # Certificate for mTLS-bound access tokens, PEM format.
  client-certificate = ${?AUTHLETE_CLIENT_CERTIFICATE}

  # v2 only, and ignored on v3 -- set them and the loader warns. Kept so a v2 deployment has a
  # documented path.
  service-api-key = ${?AUTHLETE_SERVICE_APIKEY}
  service-api-secret = ${?AUTHLETE_SERVICE_APISECRET}
}

jwt {
  # Required. Where the issuer publishes its signing keys.
  jwks-uri = ${?JWT_JWKS_URI}

  # Required. Tokens whose `iss` differs are rejected.
  expected-issuer = ${?JWT_EXPECTED_ISSUER}

  # Required, non-empty. Accepts a HOCON list or a comma-separated string, so the environment
  # override below works for multiple audiences: JWT_EXPECTED_AUDIENCE="a,b".
  expected-audiences = ${?JWT_EXPECTED_AUDIENCE}

  clock-skew = 60 seconds
  clock-skew = ${?JWT_CLOCK_SKEW}

  jwks-ttl = 10 minutes
  jwks-ttl = ${?JWT_JWKS_TTL}

  # How long a cached JWKS may still be served when the IdP is unreachable. Trades a window of
  # accepting recently-revoked keys for surviving an IdP outage. Must be >= jwks-ttl.
  jwks-max-stale = 60 minutes
  jwks-max-stale = ${?JWT_JWKS_MAX_STALE}

  fetch-timeout = 10 seconds
  fetch-timeout = ${?JWT_FETCH_TIMEOUT}
}

# Identity federation providers. Not yet read by ConfigLoader -- config.FederationConfig exists but
# nothing loads it. Left in place so the shape is not lost.
app {
  federations = [
    {
      id = "okta"
      server = {
        name   = "Okta-hosted IdP"
        issuer = "https://YOUR_COMPANY.okta.com"
      }
      client = {
        clientId                 = "YOUR_CLIENT_ID"
        clientSecret             = "YOUR_CLIENT_SECRET"
        redirectUri              = "http://localhost:8080/api/federation/callback/okta"
        idTokenSignedResponseAlg = "RS256"
      }
    }
  ]
}
